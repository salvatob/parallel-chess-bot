name: Chess Framework CI

on:
  pull_request:
    branches: [master, dev]

  workflow_call:


permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore ParallelChessBot.sln

      - name: Build
        run: dotnet build ParallelChessBot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ParallelChessBot.sln --configuration Release --no-build
