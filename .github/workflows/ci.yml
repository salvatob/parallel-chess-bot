
name: Chess Framework CI

on:
  # all branches
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Debug project paths
        run: |
          pwd
          ls -la
          ls -la Benchmarks
          find . -iname '*benchmark*.csproj'
    
      - name: Restore dependencies
        run: dotnet restore ParallelChessBot.sln

      - name: Build
        run: dotnet build ParallelChessBot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ParallelChessBot.sln --configuration Release --no-build
